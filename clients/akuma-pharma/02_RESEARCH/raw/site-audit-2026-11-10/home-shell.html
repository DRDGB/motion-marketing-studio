    <!-- Webmaster verification placeholders. Each search engine requires a
         distinct verification code (you paste the value provided by the
         webmaster tool). Setting them lets the engine crawl deeper and
         lets the operator submit sitemap-update pings.
         Replace the VERIFY-ME values once each property is registered:
           Google Search Console:  https://search.google.com/search-console
           Bing Webmaster Tools:   https://www.bing.com/webmasters
           Yandex Webmaster:       https://webmaster.yandex.com
           Baidu Webmaster Tools:  https://ziyuan.baidu.com (mainland China)
           Naver Search Advisor:   https://searchadvisor.naver.com (Korea)
         Until replaced these meta tags are harmless — engines simply
         ignore unrecognised tokens. The presence of the tag itself is
         what some engines (Baidu, Naver) use as a signal of intent. -->
    <meta name="google-site-verification" content="VERIFY-ME-GOOGLE" />
    <meta name="msvalidate.01" content="VERIFY-ME-BING" />
    <meta name="yandex-verification" content="VERIFY-ME-YANDEX" />

         compatibility fallback for the few browsers that don't do

    <!-- LCP hero preload — explicit Open Graph image preload so the LCP
         (Largest Contentful Paint) candidate starts fetching during HTML
         parse instead of waiting for React hydration to discover it.
         Cuts ~300-500 ms off LCP on a 4G connection per PageSpeed
         Insights. The Hero LCP image is a fingerprinted Vite asset
         (/assets/hero-biotech-<hash>.jpg) that we can't reference from
         a static index.html; the Hero component tags its own <img>
         with fetchpriority=high, which is enough for LCP prioritisation.
         Preloading /og-image.jpg here would waste a request on a file
         the hero doesn't render, so we skip the preload entirely. -->

    <!-- Canonical link — injected synchronously at parse time so the
         FIRST byte Google reads already has a canonical, instead of
         waiting for React-Helmet to set it on hydration. Strips the query
         string (Share Kit posts append ?utm_source=… — without this every
         such share would look like a duplicate URL to Google). React-Helmet
         later overrides this per-route with the same value (or a specific
         override on detail pages), which is fine — search engines use the
         last <link rel="canonical" href="https://www.akumaenterprises-pharma.com"> wins rule.

         Why inline + window.location: index.html is a single static file
         served for every SPA route; we can't bake the path in at build time.
         Apache also emits a Link: rel=canonical HTTP header (see public/.htaccess)
         for non-JS crawlers — belt-and-braces. -->
    <script>
      (function () {
        try {
          var l = document.createElement('link');
          l.rel = 'canonical';
          l.href = 'https://www.akumaenterprises-pharma.com' + window.location.pathname;
          document.head.appendChild(l);
        } catch (e) { /* no-op on prehistoric browsers */ }
      })();
    </script>
